<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atendimento Loja Fitness</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="chat-container">

    <h1>Loja Fitness</h1>

    <div id="chat">
      <div class="mensagem bot">
        Olá! Seja bem-vinda à nossa loja fitness. Em que posso ajudar?
      </div>
    </div>

    <div class="entrada">
      <input
        type="text"
        id="mensagem"
        placeholder="Digite sua mensagem..."
      >

      <button id="enviar">
        Enviar
      </button>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
